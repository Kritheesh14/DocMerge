<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge Studio</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
<canvas id="bg-noise" aria-hidden="true"></canvas>
<div class="bg-grain" aria-hidden="true"></div>

<nav class="top-nav">
  <div class="nav-wordmark"><span class="nav-mark"></span>Merge Studio</div>
  <div class="nav-tag">PDF &amp; slides, combined or converted</div>
</nav>

<main id="stage">
  <div class="console" id="console">
    <svg id="ring" viewBox="0 70 600 460" xmlns="http://www.w3.org/2000/svg" aria-label="Operations console">
      <defs>
        <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".09"/></linearGradient>
        <radialGradient id="hubGrad" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f7f0e8"/><stop offset=".6" stop-color="#ead0c0"/><stop offset="1" stop-color="#d9a088"/></radialGradient>
      <linearGradient id="petalGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#54424a"/><stop offset="1" stop-color="#1a1315"/></linearGradient>
        <radialGradient id="aura"><stop offset="0" stop-color="#EE7C53" stop-opacity=".5"/><stop offset=".6" stop-color="#EE7C53" stop-opacity=".16"/><stop offset="1" stop-color="#EE7C53" stop-opacity="0"/></radialGradient>
        <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
    </svg>
  </div>
  <p id="console-caption" aria-live="polite"></p>

  <input type="file" id="file-input" multiple accept=".pdf,.pptx,.ppt" hidden />

  <section class="queue" id="queue" hidden>
    <div class="queue-head">
      <span>Queue &nbsp;<span id="count">0</span> / 20 files</span>
      <button class="btn-clear" id="clear-btn">Clear all</button>
    </div>
    <div class="legend">
      <span><span class="legend-dot" style="background:var(--pdf-clr)"></span>PDF</span>
      <span><span class="legend-dot" style="background:var(--ppt-clr)"></span>PPTX / PPT</span>
      <span class="tip" style="margin-left:auto">Drag ⣿ to reorder. Drag a row onto the ring to use all files.</span>
    </div>
    <div id="file-list"></div>
    <div id="mode-badge"></div>
    <div class="naming-container">
      <span class="naming-label">Merged file name</span>
      <div class="naming-input-wrapper">
        <input type="text" id="filename-input" class="filename-input" value="merged" spellcheck="false" />
        <span id="ext-preview" class="filename-ext-preview">.pdf</span>
      </div>
    </div>
    <div class="progress-wrap" id="progress-wrap"><div class="progress-bar"></div></div>
  </section>
</main>

<footer class="site-footer">Tap to upload. Hold to choose what happens next.</footer>

<div id="toast"></div>
<script src="/static/script.js?v={{ v }}"></script>
</body>
</html>
