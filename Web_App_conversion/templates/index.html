<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge Studio</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg-grain"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div class="bg-lines"></div>

<nav class="top-nav">
  <div class="nav-wordmark">Merge Studio</div>
  <div class="nav-tag">Document tools</div>
</nav>

<main id="stage">
  <div class="console" id="console">
    <svg id="ring" viewBox="0 70 600 460" xmlns="http://www.w3.org/2000/svg" aria-label="Operations console"></svg>
  </div>
  <p id="console-caption" aria-live="polite"></p>

  <input type="file" id="file-input" multiple accept=".pdf,.pptx,.ppt" />

  <div class="shell">
    <div class="counter"><span id="count">0</span> / 20 files</div>
    <div class="legend">
      <span><span class="legend-dot" style="background:var(--pdf-clr)"></span>PDF</span>
      <span><span class="legend-dot" style="background:var(--ppt-clr)"></span>PPTX / PPT</span>
    </div>
    <div id="file-list">
      <div class="empty-state">No files yet &mdash; add some above</div>
    </div>
    <div id="mode-badge"></div>
    <div class="naming-container">
      <span class="naming-label">Output Filename</span>
      <div class="naming-input-wrapper">
        <input type="text" id="filename-input" class="filename-input" value="merged" spellcheck="false" />
        <span id="ext-preview" class="filename-ext-preview">.pdf</span>
      </div>
    </div>
    <div class="progress-wrap" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  </div>
</main>

<div class="ticker-wrap">
  <div class="ticker-track">
    <div class="ticker-item">Merge PDFs <span class="ticker-sep"></span></div>
    <div class="ticker-item">Combine slide decks <span class="ticker-sep"></span></div>
    <div class="ticker-item">PDF to Word <span class="ticker-sep"></span></div>
    <div class="ticker-item">PDF to PowerPoint <span class="ticker-sep"></span></div>
    <div class="ticker-item">Mixed formats <span class="ticker-sep"></span></div>
    <div class="ticker-item">Up to 20 files <span class="ticker-sep"></span></div>
  </div>
</div>
<footer class="site-footer">Merge Studio &copy; 2025</footer>

<div id="toast"></div>
<script src="/static/script.js"></script>
</body>
</html>
